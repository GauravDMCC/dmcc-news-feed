<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>DMCC News Feed</title>

  <style>
    :root { --border:#e9e9e9; --text:#111; --muted:#666; }
    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      color: var(--text);
      background: #fff;
    }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 16px 18px; }
    h1 { margin: 0 0 12px; font-size: 18px; font-weight: 700; }

    .item {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 18px;
      padding: 18px 0;
      border-bottom: 1px solid var(--border);
      align-items: start;
    }
    .media img { width: 100%; height: auto; border-radius: 6px; display: block; }
    .title { font-size: 18px; font-weight: 700; margin: 0 0 8px; line-height: 1.25; }
    .title a { color: var(--text); text-decoration: none; }
    .title a:hover { text-decoration: underline; }
    .meta { font-size: 12px; color: var(--muted); margin-bottom: 10px; }
    .desc { font-size: 13px; line-height: 1.5; color: #222; }

    @media (max-width: 820px) {
      .item { grid-template-columns: 1fr; }
      .media { order: 1; }
      .content { order: 2; }
    }
  </style>
</head>

<body>
  <div class="wrap">
    <h1>DMCC News Feed</h1>
    <div id="feed">Loading…</div>
  </div>

  <script>
    // news.json is rebuilt hourly by .github/workflows/update-news.yml
    const MAX_ITEMS = 8;

    function esc(s) {
      return String(s == null ? "" : s)
        .replace(/&/g, "&amp;").replace(/</g, "&lt;")
        .replace(/>/g, "&gt;").replace(/"/g, "&quot;");
    }

    function safeUrl(u) {
      return /^https?:\/\//i.test(u || "") ? u : "";
    }

    function formatDate(iso) {
      if (!iso) return "";
      const d = new Date(iso);
      if (isNaN(d.getTime())) return "";
      return d.toLocaleDateString("en-GB", { year: "numeric", month: "long", day: "2-digit" });
    }

    const feed = document.getElementById("feed");

    fetch("news.json?ts=" + Date.now())
      .then(r => {
        if (!r.ok) throw new Error("HTTP " + r.status);
        return r.json();
      })
      .then(data => {
        const items = (data.items || []).slice(0, MAX_ITEMS);
        if (!items.length) {
          feed.textContent = "No items found.";
          return;
        }

        feed.innerHTML = items.map(it => {
          const link = safeUrl(it.link);
          const img = safeUrl(it.image);
          return `
            <div class="item">
              <div class="media">
                ${img ? `<a href="${esc(link)}" target="_blank" rel="noopener"><img src="${esc(img)}" alt="" loading="lazy"></a>` : ``}
              </div>
              <div class="content">
                <div class="title"><a href="${esc(link)}" target="_blank" rel="noopener">${esc(it.title)}</a></div>
                <div class="meta">${esc(formatDate(it.date))}</div>
                ${it.description ? `<div class="desc">${esc(it.description)}</div>` : ``}
              </div>
            </div>`;
        }).join("");
      })
      .catch(err => {
        console.error(err);
        feed.textContent = "Failed to load news. Please try again later.";
      });
  </script>
</body>
</html>
