name: Update news feed

on:
  schedule:
    - cron: "0 * * * *"   # every hour
  workflow_dispatch: {}    # allows a manual run from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch RSS and build news.json
        run: python3 scripts/fetch_news.py

      - name: Commit if changed
        run: |
          git config user.name "news-feed-bot"
          git config user.email "news-feed-bot@users.noreply.github.com"
          git add news.json
          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "Update news.json"
            git push
          fi
